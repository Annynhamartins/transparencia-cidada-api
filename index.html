<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transparência Cidadã - Simplificador de Documentos</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            width: 100%;
            max-width: 800px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        h1 {
            color: #58a6ff;
            font-size: 2rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        p.subtitle {
            color: #8b949e;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #f0f6fc;
        }
        textarea {
            width: 100%;
            height: 150px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #f0f6fc;
            padding: 12px;
            font-size: 1rem;
            resize: vertical;
            outline: none;
            margin-bottom: 20px;
        }
        textarea:focus {
            border-color: #58a6ff;
        }
        button {
            width: 100%;
            background: linear-gradient(135deg, #2ea043, #238636);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }
        button:hover {
            opacity: 0.9;
        }
        .result-box {
            margin-top: 30px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            display: none;
        }
        .result-card {
            margin-bottom: 15px;
        }
        .result-card h3 {
            color: #388bfd;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }
        .result-card p {
            color: #c9d1d9;
            line-height: 1.5;
        }
        .loading {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: #8b949e;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚖️ Transparência Cidadã</h1>
        <p class="subtitle">Simplificador automatizado de documentos públicos e processos administrativos.</p>

        <label for="textoDocumento">Cole o texto do documento oficial abaixo:</label>
        <textarea id="textoDocumento" placeholder="Cole aqui o trecho do edital, contrato ou documento público..."></textarea>

        <button onclick="simplificarDocumento()">✨ Simplificar Documento</button>

        <div class="loading" id="loading">Analisando documento no servidor... aguarde ⏳</div>

        <div class="result-box" id="resultBox">
            <div class="result-card">
                <h3>📋 Resumo Cidadão</h3>
                <p id="resumoCidadao">-</p>
            </div>
            <div class="result-card">
                <h3>🎯 Impacto Social</h3>
                <p id="impactoSocial">-</p>
            </div>
            <div class="result-card">
                <h3>🔎 Recomendação de Fiscalização</h3>
                <p id="recomendacaoFiscalizacao">-</p>
            </div>
        </div>
    </div>

    <script>
        async function simplificarDocumento() {
            const texto = document.getElementById('textoDocumento').value;
            const loading = document.getElementById('loading');
            const resultBox = document.getElementById('resultBox');

            if (!texto.trim()) {
                alert('Por favor, cole um texto para simplificar.');
                return;
            }

            loading.style.display = 'block';
            resultBox.style.display = 'none';

            try {
                const response = await fetch('https://transparencia-cidada-api.onrender.com/api/simplificar', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ texto: texto })
                });

                const data = await response.json();

                document.getElementById('resumoCidadao').innerText = data.resumo_cidadao;
                document.getElementById('impactoSocial').innerText = data.impacto_social;
                document.getElementById('recomendacaoFiscalizacao').innerText = data.recomendacao_fiscalizacao;

                resultBox.style.display = 'block';
            } catch (error) {
                alert('Erro ao conectar com o servidor da API.');
            } finally {
                loading.style.display = 'none';
            }
        }
    </script>

</body>
</html>
